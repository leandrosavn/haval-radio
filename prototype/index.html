<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Haval FM — UI mockup</title>
<style>
  :root{
    --bg0:#08090b; --bg1:#11141a; --card:#161b24; --card2:#121722;
    --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.13);
    --txt:#eef2f8; --muted:#9099a8; --muted2:#5f6776;
    --accent:#19e3b1; --accent2:#0bb69a; --accentSoft:#5ff0cf; --amber:#ffb13c;
    --glow: 25,227,177;           /* rgb do acento p/ rgba() */
    --onAccent:#04140f;           /* texto sobre o acento (contraste) */
    --radius:26px; --radius-sm:18px;
    --shadow:0 20px 55px rgba(0,0,0,.6);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%; background:#000; font-family:'Segoe UI',system-ui,-apple-system,sans-serif; overflow:hidden;}
  #fit{position:fixed; inset:0; overflow:hidden; background:#000;}
  #stage{
    width:1920px; height:720px; position:absolute; top:0; left:0; transform-origin:top left; color:var(--txt);
    background:
      radial-gradient(1200px 620px at 80% -12%, rgba(var(--glow),.16), transparent 60%),
      radial-gradient(900px 520px at 6% 120%, rgba(var(--glow),.10), transparent 60%),
      linear-gradient(160deg,var(--bg1),var(--bg0));
    display:grid; grid-template-columns: 128px 1fr 600px; grid-template-rows: 84px 1fr;
    grid-template-areas: "rail topbar topbar" "rail now favs";
  }

  /* modo claro (override das variáveis estruturais) */
  #stage.light{
    --bg0:#e7ebf1; --bg1:#f6f8fb; --card:#ffffff; --card2:#eef2f7;
    --line:rgba(20,30,50,.10); --line2:rgba(20,30,50,.17);
    --txt:#1b2230; --muted:#5d6675; --muted2:#9aa4b2;
  }
  #stage.light .rail{background:rgba(0,0,0,.05);}
  #stage.light .favs{background:rgba(0,0,0,.025);}
  #stage.light .seg button.on{color:var(--txt);}
  #stage.light .vol .thumb{box-shadow:0 4px 12px rgba(0,0,0,.22), 0 0 0 4px rgba(var(--glow),.3);}

  /* faixa do sistema — propositalmente apagada: não é do app */
  .rail{grid-area:rail; border-right:1px solid var(--line); display:flex; flex-direction:column; align-items:center; padding:20px 0 16px; background:rgba(0,0,0,.5);}
  .sys-clock{font-size:21px; font-weight:700; color:var(--muted); letter-spacing:.5px;}
  .sys-glyphs{display:flex; flex-direction:column; gap:20px; margin-top:28px; font-size:18px; filter:grayscale(1) opacity(.5);}
  .sys-spacer{flex:1;}
  .sys-home{width:46px; height:5px; border-radius:4px; background:var(--muted2); opacity:.5;}
  .sys-tag{margin-top:12px; font-size:9px; letter-spacing:2px; text-transform:uppercase; color:var(--muted2); opacity:.55;}

  /* topbar */
  .topbar{grid-area:topbar; display:flex; align-items:center; padding:0 40px; gap:20px; border-bottom:1px solid var(--line);}
  .seg{display:flex; background:var(--card2); border:1px solid var(--line); border-radius:16px; padding:5px; gap:4px;}
  .seg button{appearance:none; border:0; background:transparent; color:var(--muted); font-weight:700; font-size:18px; letter-spacing:.5px; padding:9px 28px; border-radius:12px; cursor:pointer; transition:.18s;}
  .seg button.on{background:linear-gradient(180deg,rgba(var(--glow),.26),rgba(var(--glow),.12)); color:#fff; box-shadow:0 0 0 1px rgba(var(--glow),.45);}
  .topbar .spacer{flex:1;}
  .pill{display:flex; align-items:center; gap:9px; color:var(--muted); font-size:16px; font-weight:600; background:var(--card2); border:1px solid var(--line); padding:9px 16px; border-radius:14px;}
  .pill b{color:var(--txt); font-weight:700;}
  .pill .dot{color:var(--accent);}

  /* NOW PLAYING */
  .now{grid-area:now; padding:20px 36px 16px; display:flex; flex-direction:column; gap:14px; min-width:0;}
  .station{display:flex; align-items:center; gap:22px;}
  .logo{width:98px;height:98px;border-radius:26px; display:grid;place-items:center; font-weight:800; font-size:32px; color:#fff; box-shadow:var(--shadow), inset 0 0 0 1.5px rgba(255,255,255,.16); flex:none; letter-spacing:.5px; text-shadow:0 1px 3px rgba(0,0,0,.4);}
  .station .meta{min-width:0;}
  .band-tag{display:inline-flex; align-items:center; gap:8px; font-size:13px; font-weight:800; letter-spacing:2px; color:var(--accentSoft); text-transform:uppercase;}
  .band-tag::before{content:''; width:8px;height:8px;border-radius:50%; background:var(--accent); box-shadow:0 0 10px var(--accent);}
  .freq{font-size:72px; font-weight:800; line-height:.9; letter-spacing:-1.5px; margin:2px 0 0;}
  .freq small{font-size:28px; font-weight:700; color:var(--muted); margin-left:11px; letter-spacing:0;}
  .name{font-size:28px; font-weight:800; margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .rds{color:var(--muted); font-size:17px; margin-top:5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .badges{display:flex; gap:9px; margin-top:11px;}
  .badge{font-size:12px; font-weight:800; letter-spacing:1.2px; color:var(--muted); border:1px solid var(--line2); padding:6px 12px; border-radius:10px;}
  .badge.on{color:var(--accentSoft); border-color:rgba(var(--glow),.45); background:rgba(var(--glow),.09);}

  /* dial card */
  .dial{margin-top:auto; background:linear-gradient(180deg,var(--card),var(--card2)); border:1px solid var(--line); border-radius:var(--radius); padding:12px 22px 14px; box-shadow:var(--shadow); position:relative;}
  .dial-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:4px;}
  .dial-head .lbl{font-size:12px; font-weight:800; letter-spacing:2px; color:var(--muted2); text-transform:uppercase;}
  /* seletor de modo (claro/escuro/sistema) */
  .modeseg{display:flex; background:var(--card2); border:1px solid var(--line); border-radius:14px; padding:4px; gap:3px;}
  .modeseg button{appearance:none; border:0; background:transparent; color:var(--muted); font-size:16px; width:40px; height:34px; border-radius:10px; cursor:pointer; transition:.15s; display:grid; place-items:center;}
  .modeseg button.on{background:rgba(var(--glow),.16); color:var(--txt); box-shadow:0 0 0 1px rgba(var(--glow),.4);}

  /* dial: régua */
  #dialLinear{position:relative; cursor:grab; touch-action:none; user-select:none;}
  #dialLinear.grabbing{cursor:grabbing;}
  #dialLinear .needle{position:absolute; top:0; height:74px; left:50%; width:2px; background:linear-gradient(var(--accent),transparent); transform:translateX(-50%); z-index:3;}
  #dialLinear .needle::after{content:''; position:absolute; top:12px; left:50%; transform:translateX(-50%); width:14px; height:14px; border-radius:50%; background:var(--accent); box-shadow:0 0 18px var(--accent);}
  .scale{height:74px; position:relative; overflow:hidden;}
  .ticks{position:absolute; inset:0; transition:transform .4s cubic-bezier(.2,.8,.2,1);}
  .tick{border-left:1px solid var(--line2); height:18px; position:absolute; bottom:8px;}
  .tick.major{height:34px; border-left-color:rgba(255,255,255,.3);}
  .tick.major span{position:absolute; bottom:38px; left:50%; transform:translateX(-50%); font-size:13px; color:var(--muted); font-weight:600;}

  .transport{display:flex; align-items:center; justify-content:center; gap:18px; margin-top:8px;}
  .tbtn{appearance:none; border:1px solid var(--line); background:var(--card2); color:var(--txt); width:66px;height:66px;border-radius:50%; font-size:24px; cursor:pointer; display:grid; place-items:center; transition:.15s;}
  .tbtn:hover{border-color:var(--line2); transform:translateY(-1px);}
  .tbtn.big{width:78px;height:78px; font-size:30px;}
  .tbtn.play{width:88px;height:88px; background:linear-gradient(180deg,var(--accent),var(--accent2)); color:var(--onAccent); border:0; font-size:34px; box-shadow:0 12px 34px rgba(var(--glow),.45);}

  /* volume */
  .volbar{display:flex; align-items:center; gap:14px; margin-top:12px; padding:0 2px;}
  .spk{appearance:none; border:1px solid var(--line); background:var(--card2); color:var(--txt); width:52px;height:52px;border-radius:15px; font-size:23px; cursor:pointer; display:grid; place-items:center; transition:.15s; flex:none;}
  .spk:hover{border-color:var(--line2);}
  .vol{flex:1; position:relative; height:16px; border-radius:12px; background:var(--card2); border:1px solid var(--line); cursor:pointer; touch-action:none;}
  .vol .fill{position:absolute; left:0; top:0; bottom:0; border-radius:12px; background:linear-gradient(90deg,var(--accent2),var(--accent)); box-shadow:0 0 16px rgba(var(--glow),.4);}
  .vol .thumb{position:absolute; top:50%; transform:translate(-50%,-50%); width:32px;height:32px;border-radius:50%; background:#fff; box-shadow:0 6px 16px rgba(0,0,0,.5), 0 0 0 4px rgba(var(--glow),.28);}
  .pct{width:50px; text-align:right; font-size:20px; font-weight:800; color:var(--txt); flex:none;}

  /* FAVORITES */
  .favs{grid-area:favs; border-left:1px solid var(--line); background:rgba(0,0,0,.2); display:flex; flex-direction:column; min-height:0;}
  .favs header{display:flex; align-items:center; gap:14px; padding:24px 28px 14px;}
  .favs header .bar{width:5px; height:24px; border-radius:3px; background:var(--accent); box-shadow:0 0 12px rgba(var(--glow),.6);}
  .favs header h2{margin:0; font-size:22px; font-weight:800; letter-spacing:.3px;}
  .favs header .count{color:var(--muted); font-size:15px; font-weight:600;}
  .favs header .spacer{flex:1;}
  .btn{appearance:none; border:1px solid var(--line2); background:var(--card2); color:var(--txt); font-weight:700; font-size:15px; padding:10px 16px; border-radius:13px; cursor:pointer; display:inline-flex; align-items:center; gap:8px; transition:.15s;}
  .btn:hover{border-color:var(--accent); color:var(--accentSoft);}
  .btn.primary{background:linear-gradient(180deg,var(--accent),var(--accent2)); color:var(--onAccent); border:0;}

  /* seletor de cor (acento) */
  .swatches{display:flex; gap:8px; align-items:center; margin-left:4px;}
  .sw{width:26px;height:26px;border-radius:50%; border:0; background:var(--c); cursor:pointer; padding:0; transition:.15s;}
  .sw:hover{transform:scale(1.08);}
  .sw.on{box-shadow:0 0 0 2px var(--bg0), 0 0 0 4px var(--c);}
  .btn.on{background:rgba(var(--glow),.14); border-color:var(--accent); color:var(--accentSoft);}

  .grid{display:grid; grid-template-columns:repeat(2,1fr); gap:14px; padding:6px 28px 8px; overflow:auto;}
  .preset{position:relative; display:flex; align-items:center; gap:14px; padding:16px; border-radius:var(--radius-sm); background:linear-gradient(180deg,var(--card),var(--card2)); border:1px solid var(--line); cursor:pointer; transition:.16s; user-select:none;}
  .preset:hover{border-color:var(--line2); transform:translateY(-2px);}
  .preset.active{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent), 0 14px 30px rgba(var(--glow),.2); background:linear-gradient(180deg,rgba(var(--glow),.10),var(--card2));}
  .preset .plogo{width:50px;height:50px;border-radius:15px; flex:none; display:grid; place-items:center; font-weight:800; font-size:17px; color:#fff; box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.15); text-shadow:0 1px 2px rgba(0,0,0,.4);}
  .preset .pinfo{min-width:0; flex:1;}
  .preset .pfreq{font-size:21px; font-weight:800; letter-spacing:-.3px;}
  .preset .pfreq b{font-size:13px; color:var(--muted); font-weight:700; margin-left:5px;}
  .preset .pname{font-size:14px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .preset .slot{position:absolute; top:9px; right:12px; font-size:12px; color:var(--muted2); font-weight:800;}
  .preset .rm{position:absolute; top:8px; right:8px; width:26px;height:26px;border-radius:50%; background:#e0556a; color:#fff; border:0; font-size:15px; display:none; place-items:center; cursor:pointer;}
  .preset .drag{position:absolute; left:8px; top:50%; transform:translateY(-50%); color:var(--muted2); font-size:18px; display:none; cursor:grab;}
  .editing .preset{padding-left:34px;}
  .editing .preset .rm{display:grid;}
  .editing .preset .drag{display:block;}
  .editing .preset .slot{display:none;}
  .preset.dragging{opacity:.4;}
  .preset.over{border-style:dashed; border-color:var(--accent);}

  .scan{border-top:1px solid var(--line); padding:14px 28px 18px; margin-top:auto;}
  .scan .shead{display:flex; align-items:center; gap:10px; color:var(--muted); font-size:14px; font-weight:700; letter-spacing:.5px; margin-bottom:10px;}
  .scan .shead .live{width:8px;height:8px;border-radius:50%;background:var(--accent); box-shadow:0 0 10px var(--accent);}
  .chips{display:flex; gap:10px; overflow:auto; padding-bottom:4px;}
  .chip{flex:none; display:flex; align-items:center; gap:8px; padding:10px 14px; border-radius:13px; background:var(--card2); border:1px solid var(--line); cursor:pointer; font-weight:700; font-size:15px; transition:.15s;}
  .chip:hover{border-color:var(--accent);}
  .chip .star{color:var(--muted2); font-size:14px;}
  .chip.fav .star{color:var(--amber);}
  .chip small{color:var(--muted); font-weight:600;}

  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08); border-radius:8px;}

  /* botão de versão + modal "Sobre / atualização" */
  .btn.ver{font-variant-numeric:tabular-nums; opacity:.9;}
  .modal-backdrop{position:absolute; inset:0; background:rgba(0,0,0,.55); display:none; align-items:center; justify-content:center; z-index:60;}
  .modal-backdrop.show{display:flex;}
  .modal{width:460px; background:linear-gradient(180deg,var(--card),var(--card2)); border:1px solid var(--line2); border-radius:24px; padding:28px; box-shadow:var(--shadow);}
  .modal-title{font-size:24px; font-weight:800; margin-bottom:16px;}
  .modal-body{font-size:17px; color:var(--txt); display:flex; flex-direction:column; gap:14px;}
  .modal-body b{font-weight:800;}
  .modal-msg{color:var(--muted); font-size:16px;}
  .modal-msg.ok{color:var(--accentSoft);}
  .modal-prog{display:none; align-items:center; gap:12px;}
  .modal-prog.show{display:flex;}
  .pbar{flex:1; height:10px; border-radius:6px; background:var(--card2); border:1px solid var(--line); overflow:hidden;}
  .pbar > i{display:block; height:100%; width:0%; background:linear-gradient(90deg,var(--accent2),var(--accent)); transition:width .15s;}
  .modal-actions{display:flex; gap:10px; justify-content:flex-end; margin-top:24px;}
</style>
</head>
<body>
<div id="fit"><div id="stage">

  <!-- barra de status do SISTEMA (128px reservados — NÃO pertence ao app) -->
  <div class="rail" title="Barra de status do sistema (128px). Reservada pelo SO — o app desenha só nos 1792px à direita.">
    <div class="sys-clock" id="clock">16:25</div>
    <div class="sys-glyphs"><span>📶</span><span>🛰️</span><span>❄️</span></div>
    <div class="sys-spacer"></div>
    <div class="sys-home"></div>
    <div class="sys-tag">sistema</div>
  </div>

  <!-- topbar -->
  <div class="topbar">
    <div class="seg" id="band">
      <button class="on" data-band="FM">FM</button>
      <button data-band="AM">AM</button>
    </div>
    <div class="pill">Sinal <b id="signal">▮▮▮▮▯</b></div>
    <div class="pill"><span class="dot">●</span> <b>Estéreo</b></div>
    <div class="spacer"></div>
    <div class="modeseg" id="modeSeg" title="Tema">
      <button data-mode="light" title="Claro">☀</button>
      <button class="on" data-mode="dark" title="Escuro">🌙</button>
      <button data-mode="system" title="Do sistema do carro">🚗</button>
    </div>
    <div class="swatches" id="swatches" title="Cor de acento"></div>
  </div>

  <!-- now playing -->
  <div class="now">
    <div class="station">
      <div class="logo" id="logo">A1</div>
      <div class="meta">
        <span class="band-tag"><span id="bandTag">FM</span> · ao vivo</span>
        <div class="freq"><span id="freq">94.7</span><small id="unit">MHz</small></div>
        <div class="name" id="name">Antena 1</div>
        <div class="rds" id="rds">♫ Dire Straits — Sultans of Swing</div>
        <div class="badges">
          <span class="badge on" id="bStereo">STEREO</span>
          <span class="badge on">RDS</span>
          <span class="badge" id="bHd">HD</span>
        </div>
      </div>
    </div>

    <div class="dial">
      <div class="dial-head">
        <span class="lbl">Sintonia · arraste para sintonizar</span>
      </div>

      <div id="dialLinear">
        <div class="needle"></div>
        <div class="scale"><div class="ticks" id="ticks"></div></div>
      </div>

      <div class="transport">
        <button class="tbtn big" id="seekDown" title="Estação anterior">⏮</button>
        <button class="tbtn play" id="play">▶</button>
        <button class="tbtn big" id="seekUp" title="Próxima estação">⏭</button>
      </div>
      <div class="volbar">
        <button class="spk" id="spk" title="Silenciar">🔊</button>
        <div class="vol" id="vol"><div class="fill" id="volFill"></div><div class="thumb" id="volThumb"></div></div>
        <div class="pct" id="volPct">22%</div>
      </div>
    </div>
  </div>

  <!-- favorites -->
  <div class="favs" id="favs">
    <header>
      <span class="bar"></span>
      <h2>Favoritos</h2>
      <span class="count" id="favCount">6 estações</span>
      <span class="spacer"></span>
      <button class="btn" id="addCur">★ Salvar atual</button>
      <button class="btn" id="editBtn">✎ Editar</button>
      <button class="btn ver" id="verBtn">ⓘ v0.3.1</button>
    </header>
    <div class="grid" id="grid"></div>

    <div class="scan">
      <div class="shead"><span class="live"></span> ENCONTRADAS NA BUSCA · toque pra sintonizar</div>
      <div class="chips" id="chips"></div>
    </div>
  </div>

  <!-- modal Sobre / atualização -->
  <div class="modal-backdrop" id="aboutModal">
    <div class="modal">
      <div class="modal-title">Haval Radio</div>
      <div class="modal-body">
        <div>Versão atual: <b id="curVer">0.3.1</b></div>
        <div class="modal-msg" id="updMsg"></div>
        <div class="modal-prog" id="updProg"><div class="pbar"><i id="pbarFill"></i></div><span id="pPct">0%</span></div>
      </div>
      <div class="modal-actions">
        <button class="btn" id="updCheck">Verificar atualização</button>
        <button class="btn primary" id="updDo" style="display:none">Baixar e instalar</button>
        <button class="btn" id="updClose">Fechar</button>
      </div>
    </div>
  </div>

</div></div>

<script>
  // ---- escala do palco ----
  function fit(){
    const s=document.getElementById('stage');
    const k=Math.min(window.innerWidth/1920, window.innerHeight/720);
    const tx=(window.innerWidth-1920*k)/2, ty=(window.innerHeight-720*k)/2;
    s.style.transform='translate('+tx+'px,'+ty+'px) scale('+k+')';
  }
  addEventListener('resize',fit); addEventListener('load',fit);
  requestAnimationFrame(fit); fit();

  // ---- cores / logos ----
  const COLORS=['#ff6b6b','#ffb13c','#7aa2ff','#ff7ab0','#b388ff','#5ad1ff','#ffd166','#5ae0a0'];
  function shade(hex,amt){ // amt negativo escurece
    const n=parseInt(hex.slice(1),16); let r=(n>>16)+amt,g=((n>>8)&255)+amt,b=(n&255)+amt;
    r=Math.max(0,Math.min(255,r)); g=Math.max(0,Math.min(255,g)); b=Math.max(0,Math.min(255,b));
    return '#'+(r<<16|g<<8|b).toString(16).padStart(6,'0');
  }
  function logoBg(c){ return 'linear-gradient(140deg,'+c+','+shade(c,-55)+')'; }

  // ---- dados mock ----
  let favs=[
    {f:'94.7',n:'Antena 1',c:'#7aa2ff',tag:'A1'},
    {f:'99.1',n:'Kiss FM',c:'#ff7ab0',tag:'K'},
    {f:'89.1',n:'Nativa FM',c:'#5ae0a0',tag:'N'},
    {f:'105.1',n:'Nova Brasil',c:'#ffb13c',tag:'NB'},
    {f:'91.3',n:'Transamérica',c:'#b388ff',tag:'TR'},
    {f:'90.5',n:'CBN',c:'#5ad1ff',tag:'CBN'},
  ];
  const scan=[
    {f:'87.9',n:'Educadora'},{f:'89.1',n:'Nativa FM'},{f:'90.5',n:'CBN'},
    {f:'91.3',n:'Transamérica'},{f:'93.7',n:'Mix FM'},{f:'94.7',n:'Antena 1'},
    {f:'99.1',n:'Kiss FM'},{f:'100.9',n:'Jovem Pan'},{f:'105.1',n:'Nova Brasil'},{f:'107.3',n:'Alpha FM'}
  ];
  let current={f:'94.7',n:'Antena 1',c:'#7aa2ff',tag:'A1'};
  let editing=false, playing=true, band='FM';

  // ---- régua ----
  const FMIN=87.5, FMAX=108.0, SPAN=1080;
  (function(){
    const t=document.getElementById('ticks'); t.style.width=SPAN+'px';
    for(let v=FMIN; v<=FMAX+0.001; v+=0.5){
      const d=document.createElement('div');
      const major=(Math.round(v)===v && Math.round(v)%2===0);
      d.className='tick'+(major?' major':'');
      d.style.left=((v-FMIN)/(FMAX-FMIN)*SPAN)+'px';
      if(major){const s=document.createElement('span'); s.textContent=v.toFixed(0); d.appendChild(s);}
      t.appendChild(d);
    }
  })();

  // ---- sintonia (régua) ----
  function updateDial(){
    const p=Math.max(0,Math.min(1,(parseFloat(current.f)-FMIN)/(FMAX-FMIN)));
    document.getElementById('ticks').style.transform='translateX(calc(50% - '+(p*SPAN)+'px))';
  }

  // ---- render ----
  function renderNow(){
    document.getElementById('freq').textContent=current.f;
    document.getElementById('name').textContent=current.n;
    const lg=document.getElementById('logo'); lg.textContent=current.tag; lg.style.background=logoBg(current.c);
    document.getElementById('play').textContent=playing?'❚❚':'▶';
    updateDial();
    document.querySelectorAll('#grid .preset').forEach(el=>{ const i=+el.dataset.i; el.classList.toggle('active', favs[i]&&favs[i].f===current.f); });
  }
  function render(){
    renderNow();
    const g=document.getElementById('grid'); g.innerHTML='';
    favs.forEach((s,i)=>{
      const el=document.createElement('div');
      el.className='preset'+(s.f===current.f?' active':'');
      el.draggable=true; el.dataset.i=i;
      el.innerHTML=`
        <span class="drag">⠿</span>
        <span class="slot">P${i+1}</span>
        <div class="plogo" style="background:${logoBg(s.c)}">${s.tag}</div>
        <div class="pinfo"><div class="pfreq">${s.f}<b>${band}</b></div><div class="pname">${s.n}</div></div>
        <button class="rm" data-rm="${i}">×</button>`;
      el.addEventListener('click',()=>{ if(!editing) tuneTo(s); });
      el.addEventListener('dragstart',e=>{ if(!editing){e.preventDefault();return;} el.classList.add('dragging'); e.dataTransfer.setData('i',i);});
      el.addEventListener('dragend',()=>el.classList.remove('dragging'));
      el.addEventListener('dragover',e=>{e.preventDefault(); el.classList.add('over');});
      el.addEventListener('dragleave',()=>el.classList.remove('over'));
      el.addEventListener('drop',e=>{e.preventDefault(); el.classList.remove('over'); const from=+e.dataTransfer.getData('i'); const m=favs.splice(from,1)[0]; favs.splice(i,0,m); render();});
      g.appendChild(el);
    });
    g.querySelectorAll('[data-rm]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation(); favs.splice(+b.dataset.rm,1); render();}));
    document.getElementById('favCount').textContent=favs.length+' estações';

    const c=document.getElementById('chips'); c.innerHTML='';
    scan.forEach(s=>{
      const isFav=favs.some(f=>f.f===s.f);
      const el=document.createElement('div');
      el.className='chip'+(isFav?' fav':'');
      el.innerHTML=`<span class="star">★</span> ${s.f} <small>${s.n}</small>`;
      el.addEventListener('click',()=>tuneTo({f:s.f,n:s.n,c:pick(s.f),tag:initials(s.n)}));
      c.appendChild(el);
    });
  }
  function pick(f){return COLORS[Math.floor(parseFloat(f))%COLORS.length];}
  function initials(n){return n.split(' ').map(w=>w[0]).join('').slice(0,3).toUpperCase();}
  function tuneTo(s){ current={...s}; playing=true; render(); }

  // ---- ações ----
  document.getElementById('editBtn').addEventListener('click',function(){
    editing=!editing; document.getElementById('favs').classList.toggle('editing',editing);
    this.classList.toggle('on',editing); this.innerHTML=editing?'✓ Concluir':'✎ Editar';
  });
  document.getElementById('addCur').addEventListener('click',()=>{
    if(favs.some(f=>f.f===current.f)) return; favs.unshift({...current}); render();
  });
  document.getElementById('play').addEventListener('click',()=>{playing=!playing; render();});
  function seek(dir){const list=scan.map(s=>parseFloat(s.f)).sort((a,b)=>a-b); let v=parseFloat(current.f); let nx=dir>0?list.find(x=>x>v):[...list].reverse().find(x=>x<v); if(nx==null)nx=dir>0?list[0]:list[list.length-1]; const hit=scan.find(s=>parseFloat(s.f)===nx); tuneTo({f:hit.f,n:hit.n,c:pick(hit.f),tag:initials(hit.n)});}
  document.getElementById('seekUp').addEventListener('click',()=>seek(1));
  document.getElementById('seekDown').addEventListener('click',()=>seek(-1));
  document.querySelectorAll('#band button').forEach(b=>b.addEventListener('click',function(){
    document.querySelectorAll('#band button').forEach(x=>x.classList.remove('on')); this.classList.add('on');
    band=this.dataset.band; document.getElementById('bandTag').textContent=band; document.getElementById('unit').textContent=band==='FM'?'MHz':'kHz'; render();
  }));

  // seletor de cor (acento) — parametrizável
  const THEMES={
    teal:  {accent:'#19e3b1',accent2:'#0bb69a',soft:'#5ff0cf',glow:'25,227,177',on:'#04140f'},
    green: {accent:'#36d399',accent2:'#19a877',soft:'#74e9bd',glow:'54,211,153',on:'#04210f'},
    cyan:  {accent:'#22c3ff',accent2:'#0a93cc',soft:'#7adcff',glow:'34,195,255',on:'#04222e'},
    blue:  {accent:'#3b82f6',accent2:'#1d5fd1',soft:'#8fb4ff',glow:'59,130,246',on:'#ffffff'},
    violet:{accent:'#a06bff',accent2:'#7b3fe4',soft:'#c5a3ff',glow:'160,107,255',on:'#ffffff'},
    pink:  {accent:'#ff5fa2',accent2:'#d6356f',soft:'#ff9cc4',glow:'255,95,162',on:'#33091c'},
    red:   {accent:'#ff3b46',accent2:'#c41020',soft:'#ff7a82',glow:'255,59,70',on:'#ffffff'},
    orange:{accent:'#ff8a3d',accent2:'#db6312',soft:'#ffb285',glow:'255,138,61',on:'#2e1500'},
    amber: {accent:'#ffb13c',accent2:'#e08a1e',soft:'#ffd089',glow:'255,177,60',on:'#2a1a00'},
  };
  const LS={get:(k,d)=>{try{return localStorage.getItem(k)||d;}catch(e){return d;}},
            set:(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}}};
  function applyTheme(t){const th=THEMES[t]; const r=document.documentElement.style;
    r.setProperty('--accent',th.accent); r.setProperty('--accent2',th.accent2);
    r.setProperty('--accentSoft',th.soft); r.setProperty('--glow',th.glow); r.setProperty('--onAccent',th.on);
    LS.set('fmAccent',t);}
  let savedAccent=LS.get('fmAccent','teal'); if(!THEMES[savedAccent]) savedAccent='teal';
  (function buildSwatches(){
    const c=document.getElementById('swatches');
    Object.keys(THEMES).forEach(k=>{
      const b=document.createElement('button');
      b.className='sw'+(k===savedAccent?' on':''); b.dataset.theme=k; b.title=k;
      b.style.setProperty('--c',THEMES[k].accent);
      b.addEventListener('click',function(){
        c.querySelectorAll('.sw').forEach(x=>x.classList.remove('on')); this.classList.add('on'); applyTheme(k);
      });
      c.appendChild(b);
    });
  })();
  applyTheme(savedAccent);

  // modo de tema: claro / escuro / sistema (lembrado; sistema segue prefers-color-scheme)
  let mode=LS.get('fmMode','dark'); if(!['light','dark','system'].includes(mode)) mode='dark';
  const mq=window.matchMedia('(prefers-color-scheme: dark)');
  function effDark(){ return mode==='system' ? mq.matches : mode==='dark'; }
  function applyMode(){ document.getElementById('stage').classList.toggle('light', !effDark()); }
  document.querySelectorAll('#modeSeg button').forEach(b=>{
    b.classList.toggle('on', b.dataset.mode===mode);
    b.addEventListener('click',function(){
      document.querySelectorAll('#modeSeg button').forEach(x=>x.classList.remove('on')); this.classList.add('on');
      mode=this.dataset.mode; LS.set('fmMode',mode); applyMode();
    });
  });
  mq.addEventListener('change',()=>{ if(mode==='system') applyMode(); });
  applyMode();

  // volume
  let volume=22, muted=false;
  const volEl=document.getElementById('vol');
  function renderVol(){
    const v=muted?0:volume;
    document.getElementById('volFill').style.width=v+'%';
    document.getElementById('volThumb').style.left=v+'%';
    document.getElementById('volPct').textContent=v+'%';
    document.getElementById('spk').textContent=(muted||v===0)?'🔇':(v<45?'🔉':'🔊');
  }
  function setVolFromX(x){const r=volEl.getBoundingClientRect(); let ratio=(x-r.left)/r.width; ratio=Math.max(0,Math.min(1,ratio)); volume=Math.round(ratio*100); muted=false; renderVol();}
  let vdrag=false;
  volEl.addEventListener('pointerdown',e=>{vdrag=true; volEl.setPointerCapture(e.pointerId); setVolFromX(e.clientX);});
  volEl.addEventListener('pointermove',e=>{ if(vdrag) setVolFromX(e.clientX);});
  volEl.addEventListener('pointerup',()=>{vdrag=false;});
  document.getElementById('spk').addEventListener('click',()=>{ muted=!muted; renderVol();});
  renderVol();

  // sintonia arrastando a régua
  function tuneFreqLight(f){
    const fs=f.toFixed(1);
    const hit=scan.find(s=>Math.abs(parseFloat(s.f)-f)<0.05);
    current = hit ? {f:hit.f,n:hit.n,c:pick(hit.f),tag:initials(hit.n)} : {f:fs,n:'— sintonizando —',c:'#5d6a7d',tag:'··'};
    playing=true; renderNow();
  }
  (function dragTune(){
    const dl=document.getElementById('dialLinear'), ticks=document.getElementById('ticks');
    let drag=false, sx=0, sf=0;
    dl.addEventListener('pointerdown',e=>{ drag=true; dl.setPointerCapture(e.pointerId); dl.classList.add('grabbing'); ticks.style.transition='none'; sx=e.clientX; sf=parseFloat(current.f); });
    dl.addEventListener('pointermove',e=>{ if(!drag) return; const k=Math.min(innerWidth/1920, innerHeight/720); const dx=(e.clientX-sx)/k; let f=sf - dx*(FMAX-FMIN)/SPAN; f=Math.round(Math.max(FMIN,Math.min(FMAX,f))*10)/10; if(f.toFixed(1)!==current.f) tuneFreqLight(f); });
    function end(){ if(!drag) return; drag=false; dl.classList.remove('grabbing'); ticks.style.transition=''; render(); }
    dl.addEventListener('pointerup',end); dl.addEventListener('pointercancel',end);
  })();

  // ---- Sobre / atualização (mock) ----
  (function(){
    const modal=document.getElementById('aboutModal');
    const msg=document.getElementById('updMsg');
    const prog=document.getElementById('updProg');
    const fill=document.getElementById('pbarFill');
    const pct=document.getElementById('pPct');
    const check=document.getElementById('updCheck');
    const doIt=document.getElementById('updDo');
    function reset(){ msg.textContent=''; msg.className='modal-msg'; prog.classList.remove('show'); doIt.style.display='none'; check.style.display=''; check.disabled=false; fill.style.width='0%'; pct.textContent='0%'; }
    function open(){ reset(); modal.classList.add('show'); }
    function close(){ modal.classList.remove('show'); }
    document.getElementById('verBtn').addEventListener('click',open);
    document.getElementById('updClose').addEventListener('click',close);
    modal.addEventListener('click',e=>{ if(e.target===modal) close(); });
    check.addEventListener('click',()=>{
      check.disabled=true; msg.className='modal-msg'; msg.textContent='Verificando…';
      setTimeout(()=>{ msg.classList.add('ok'); msg.textContent='Nova versão 0.4.0 disponível'; check.style.display='none'; doIt.style.display=''; },800);
    });
    doIt.addEventListener('click',()=>{
      doIt.style.display='none'; msg.className='modal-msg'; msg.textContent='Baixando…'; prog.classList.add('show');
      let p=0; const t=setInterval(()=>{ p+=Math.max(3,Math.round(Math.random()*10)); if(p>=100){ p=100; clearInterval(t); fill.style.width='100%'; pct.textContent='100%'; setTimeout(()=>{ msg.classList.add('ok'); msg.textContent='Baixado — abrindo instalador… (mock)'; prog.classList.remove('show'); },300); return; } fill.style.width=p+'%'; pct.textContent=p+'%'; },140);
    });
  })();

  // relógio do sistema
  function clock(){const d=new Date(); document.getElementById('clock').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
  clock(); setInterval(clock,10000);

  render();
</script>
</body>
</html>
